# Prueba y compila EmuLinks portable (un solo ejecutable) para 4 destinos.
# PyInstaller no compila "cruzado": cada destino se arma en su propio sistema.
#   windows-x64  Python 3.12 + PySide6
#   windows-x86  Python 3.10 32 bits + PySide2 (Qt6/PySide6 no existe en 32 bits)
#   linux-x64    Ubuntu 22.04 + PySide6 (glibc 2.35: corre en distros de 2022 en adelante)
#   linux-x86    contenedor Debian 12 i386 + PySide2 de los paquetes de Debian
# Linux sale en dos formatos: AppImage (onedir empaquetado) y tar.gz (onefile).
# No usar --collect-data PySide6: mete todos los binarios de Qt (+150 MB); el
# hook de PyInstaller ya trae las traducciones (qtbase_es.qm).
# Un tag vX.Y publica los 4 ejecutables como Release en GitHub.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python: "3.12"
            qt: PySide6
          - arch: x86
            python: "3.10"
            qt: PySide2==5.15.2.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Dependencias
        run: python -m pip install "${{ matrix.qt }}" pyinstaller pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Compilar
        run: pyinstaller --noconsole --onefile --name EmuLinks main.py
      - name: Renombrar
        shell: bash
        run: mv dist/EmuLinks.exe "dist/EmuLinks-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: EmuLinks-windows-${{ matrix.arch }}
          path: dist/EmuLinks-windows-${{ matrix.arch }}.exe

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerías de sistema para Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
      - name: Dependencias
        run: python -m pip install PySide6 pyinstaller pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Compilar
        run: |
          pyinstaller --noconsole --strip --onefile --name EmuLinks main.py
          tar -C dist -czf dist/EmuLinks-linux-x64.tar.gz EmuLinks
          pyinstaller --noconsole --strip --onedir --name EmuLinks             --distpath onedir --workpath build-onedir main.py
          bash packaging/linux/build_appimage.sh onedir/EmuLinks x86_64 dist/EmuLinks-linux-x86_64.AppImage
      - name: Probar el AppImage (arranca y sigue vivo 15 s)
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set +e
          timeout 15 dist/EmuLinks-linux-x86_64.AppImage
          code=$?
          [ "$code" -eq 124 ] || { echo "El AppImage terminó con código $code"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: EmuLinks-linux-x64
          path: |
            dist/EmuLinks-linux-x64.tar.gz
            dist/EmuLinks-linux-x86_64.AppImage

  linux-x86:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Probar y compilar en Debian i386
        run: |
          docker run --rm --platform linux/386 -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"             -v "$PWD:/src" -w /src i386/debian:bookworm bash -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              python3 python3-pip python3-pytest binutils build-essential zlib1g-dev \
              python3-pyside2.qtcore python3-pyside2.qtgui python3-pyside2.qtwidgets \
              libgl1 libegl1 fonts-dejavu-core >/dev/null
            QT_QPA_PLATFORM=offscreen python3 -m pytest -q -p no:cacheprovider tests
            pip3 install -q --break-system-packages pyinstaller
            pyinstaller --noconsole --strip --onefile --name EmuLinks main.py
            tar -C dist -czf dist/EmuLinks-linux-x86.tar.gz EmuLinks
            pyinstaller --noconsole --strip --onedir --name EmuLinks               --distpath onedir --workpath build-onedir main.py
            # el binario congelado arranca y sigue vivo 15 s
            set +e; QT_QPA_PLATFORM=offscreen timeout 15 onedir/EmuLinks/EmuLinks; code=$?; set -e
            [ "$code" -eq 124 ] || { echo "El ejecutable terminó con código $code"; exit 1; }
            chown -R "$HOST_UID:$HOST_GID" dist onedir
          '
      - name: AppImage i686
        run: bash packaging/linux/build_appimage.sh onedir/EmuLinks i686 dist/EmuLinks-linux-i686.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: EmuLinks-linux-x86
          path: |
            dist/EmuLinks-linux-x86.tar.gz
            dist/EmuLinks-linux-i686.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-x64, linux-x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "EmuLinks ${GITHUB_REF_NAME#v}" --generate-notes
